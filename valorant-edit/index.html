<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valorant Fan Edit</title>
<style>
  @font-face { font-family: "Anton"; src: url(fonts/anton.woff2) format("woff2"); font-weight: 400; }
  @font-face { font-family: "Chakra"; src: url(fonts/chakra-600.woff2) format("woff2"); font-weight: 600; }
  @font-face { font-family: "Chakra"; src: url(fonts/chakra-700.woff2) format("woff2"); font-weight: 700; }
  :root { --bg: #0b1118; --fg: #ece8e1; --red: #ff4655; --muted: #7b8794; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--fg); font-family: "Chakra", sans-serif; overflow: hidden; }
  #stage { position: absolute; inset: 0; display: grid; place-items: center; }
  canvas { width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; display: block; background: #000; }
  #ui { position: absolute; left: 16px; right: 16px; bottom: 16px; display: flex; gap: 12px; align-items: center; opacity: 0; transition: opacity .3s; }
  body:hover #ui, #ui:focus-within { opacity: 1; }
  #ui button { background: rgba(255,70,85,.15); color: var(--fg); border: 1px solid var(--red); padding: 6px 14px; font: 700 13px "Chakra", sans-serif; letter-spacing: .1em; cursor: pointer; }
  #scrub { flex: 1; accent-color: var(--red); }
  #tc { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); min-width: 52px; text-align: right; }
  #start { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.6); cursor: pointer; border: 0; color: var(--fg); font: 700 22px "Chakra", sans-serif; letter-spacing: .3em; }
  #start span { border: 2px solid var(--red); padding: 18px 36px; background: rgba(255,70,85,.12); }
  body.capture #ui, body.capture #start { display: none; }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<button id="start" aria-label="Play with sound"><span>▶ PLAY WITH SOUND</span></button>
<div id="ui">
  <button id="play" aria-label="Play or pause">PAUSE</button>
  <input id="scrub" type="range" min="0" max="16000" value="0" aria-label="Timeline">
  <span id="tc">0.00</span>
</div>
<audio id="aud" src="edit.wav" preload="auto"></audio>
<script>
(() => {
  // ============ setup ============
  const W = 1920, H = 1080, DURATION = 16, BEAT = 0.5; // 120 BPM
  const params = new URLSearchParams(location.search);
  const S = Number(params.get('scale') || 1);          // 2 = 4K
  const cv = document.getElementById('c'); cv.width = W * S; cv.height = H * S;
  const out = cv.getContext('2d');
  const mk = () => { const c = document.createElement('canvas'); c.width = W * S; c.height = H * S; return c; };
  const buf = mk(), bx = buf.getContext('2d');           // scene buffer
  const fx = mk(), fxx = fx.getContext('2d');             // post-fx scratch
  const acc = mk(), ax = acc.getContext('2d');            // motion-blur accumulator
  let ctx = bx;

  const C = { navy: '#0f1923', deep: '#070b10', red: '#ff4655', dred: '#bd3944', paper: '#ece8e1',
              mute: '#7b8794', teal: '#3ee6c4', gold: '#f5c86b' };
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const prog = (t, a, b) => clamp((t - a) / (b - a));
  const eOut = t => 1 - Math.pow(1 - t, 3);
  const eIn = t => t * t * t;
  const eIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const eOutExpo = t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t);
  const eInExpo = t => t <= 0 ? 0 : Math.pow(2, 10 * t - 10);
  const eBack = t => { const c = 2.2; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
  const TAU = Math.PI * 2;
  function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const hash = n => { const r = rng(n * 9973 + 17); return r(); };
  const F = (s, w = 700) => `${w} ${s}px "Chakra", sans-serif`;
  const A = s => `${s}px "Anton", sans-serif`;
  const beatPulse = t => Math.exp(-((t % BEAT) / BEAT) * 7);

  // ============ timeline ============
  const KILLS = [8.0, 9.0, 9.5, 10.0, 11.0];
  const ENEMIES = ['NOVA', 'KRYPT', 'VEX', 'ORION', 'HALO'];
  // impacts drive shake / flash / chromatic aberration / zoom punch
  const IMPACTS = [
    { t: 0.5, s: 4, f: .0, a: 4, z: .01 }, { t: 1.0, s: 4, f: .0, a: 4, z: .01 }, { t: 1.5, s: 6, f: .1, a: 6, z: .02 },
    { t: 2.0, s: 10, f: .35, a: 10, z: .03 }, { t: 3.0, s: 18, f: .6, a: 14, z: .05 },
    { t: 4.0, s: 8, f: .25, a: 8, z: .02 }, { t: 5.0, s: 14, f: .5, a: 10, z: .04 },
    { t: 8.0, s: 34, f: 1, a: 26, z: .09 },
    ...KILLS.slice(1, 4).map(t => ({ t, s: 20, f: .35, a: 14, z: .045 })),
    { t: 11.0, s: 44, f: .95, a: 34, z: .12 },
    { t: 12.0, s: 14, f: .7, a: 12, z: .04 }, { t: 12.5, s: 10, f: .2, a: 8, z: .03 },
    { t: 14.5, s: 10, f: .5, a: 14, z: .03 } ];
  const env = (t, key, decay) => IMPACTS.reduce((s, i) => t >= i.t ? s + i[key] * Math.exp(-(t - i.t) * decay) : s, 0);
  const GLITCH_AT = [2.0, 4.0, 8.0, 12.0, 14.5];

  // ============ shared drawing helpers ============
  function para(x, y, w, h, sk) { // parallelogram, skewed by sk px
    ctx.beginPath(); ctx.moveTo(x + sk, y); ctx.lineTo(x + w + sk, y); ctx.lineTo(x + w - sk, y + h); ctx.lineTo(x - sk, y + h); ctx.closePath();
  }
  function spaced(str, x, y, sp, align = 'center') {
    const ch = [...str], ws = ch.map(c => ctx.measureText(c).width);
    const tot = ws.reduce((a, b) => a + b, 0) + sp * (ch.length - 1);
    const prev = ctx.textAlign; ctx.textAlign = 'left';
    let cx = align === 'center' ? x - tot / 2 : align === 'right' ? x - tot : x;
    ch.forEach((c, i) => { ctx.fillText(c, cx, y); cx += ws[i] + sp; });
    ctx.textAlign = prev; return tot;
  }
  const GLY = 'ABCDEFGHJKLMNPRSTVWXYZ0123456789#/<>*';
  function scramble(str, t, start, per, rate = 30) {
    return [...str].map((c, i) => {
      if (c === ' ' || t >= start + i * per) return c;
      if (t < start - .25) return ' ';
      return GLY[Math.floor(hash(Math.floor(t * rate) * 31 + i) * GLY.length)];
    }).join('');
  }
  function glowText(str, x, y, color, blur) {
    ctx.save(); ctx.shadowColor = color; ctx.shadowBlur = blur; ctx.fillStyle = color; ctx.fillText(str, x, y); ctx.restore();
  }
  function grid(t, alpha, speed = 40) {
    ctx.save(); ctx.strokeStyle = `rgba(236,232,225,${alpha})`; ctx.lineWidth = 1;
    const g = 80, o = (t * speed) % g;
    ctx.beginPath();
    for (let x = -g + o; x < W + g; x += g) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
    for (let y = -g + o * .5; y < H + g; y += g) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke(); ctx.restore();
  }
  function cornerHUD(label) {
    ctx.save(); ctx.fillStyle = C.paper; ctx.globalAlpha = .7;
    const L = 40, m = 44;
    ctx.fillRect(m, m, L, 3); ctx.fillRect(m, m, 3, L); ctx.fillRect(W - m - L, m, L, 3); ctx.fillRect(W - m - 3, m, 3, L);
    ctx.fillRect(m, H - m - 3, L, 3); ctx.fillRect(m, H - m - L, 3, L); ctx.fillRect(W - m - L, H - m - 3, L, 3); ctx.fillRect(W - m - 3, H - m - L, 3, L);
    if (label) { ctx.font = F(20, 600); ctx.textBaseline = 'top'; spaced(label, m + 60, m - 2, 4, 'left'); }
    ctx.restore();
  }
  // stylised device used in the plant + HUD
  function spikeIcon(x, y, r, t, glow) {
    ctx.save(); ctx.translate(x, y);
    ctx.shadowColor = C.red; ctx.shadowBlur = glow;
    ctx.strokeStyle = C.red; ctx.lineWidth = r * .07;
    ctx.beginPath(); for (let i = 0; i < 6; i++) { const a = i * TAU / 6 + TAU / 12; ctx[i ? 'lineTo' : 'moveTo'](Math.cos(a) * r, Math.sin(a) * r); } ctx.closePath(); ctx.stroke();
    ctx.rotate(t * 1.5);
    for (let i = 0; i < 3; i++) { ctx.rotate(TAU / 3); ctx.beginPath(); ctx.arc(0, 0, r * .62, -.5, .5); ctx.stroke(); }
    ctx.rotate(-t * 1.5);
    ctx.fillStyle = C.red; ctx.beginPath(); ctx.moveTo(0, -r * .38); ctx.lineTo(r * .22, 0); ctx.lineTo(0, r * .38); ctx.lineTo(-r * .22, 0); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  function roleGlyph(kind, r) {
    ctx.beginPath();
    if (kind === 0) { ctx.moveTo(0, -r); ctx.lineTo(r * .9, r * .7); ctx.lineTo(-r * .9, r * .7); ctx.closePath(); }       // duelist
    else if (kind === 1) { ctx.arc(0, 0, r * .85, 0, TAU); ctx.moveTo(r * .4, 0); ctx.arc(0, 0, r * .4, 0, TAU); }     // controller
    else if (kind === 2) { ctx.moveTo(0, -r); ctx.lineTo(r, 0); ctx.lineTo(0, r); ctx.lineTo(-r, 0); ctx.closePath(); } // initiator
    else if (kind === 3) { for (let i = 0; i < 6; i++) { const a = i * TAU / 6 - Math.PI / 2; ctx[i ? 'lineTo' : 'moveTo'](Math.cos(a) * r, Math.sin(a) * r); } ctx.closePath(); } // sentinel
    else { for (let i = 0; i < 10; i++) { const a = i * TAU / 10 - Math.PI / 2, rr = i % 2 ? r * .45 : r; ctx[i ? 'lineTo' : 'moveTo'](Math.cos(a) * rr, Math.sin(a) * rr); } ctx.closePath(); } // flex
  }
  function rifle(x, y, s, kick) { // generic rifle silhouette, bottom-right viewmodel
    ctx.save(); ctx.translate(x + kick * 30, y + kick * 40); ctx.rotate(-.18 - kick * .12); ctx.scale(s, s);
    ctx.fillStyle = '#1b2733'; ctx.strokeStyle = 'rgba(255,70,85,.55)'; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-420, -30); ctx.lineTo(-40, -46); ctx.lineTo(0, -64); ctx.lineTo(160, -64); ctx.lineTo(200, -40);
    ctx.lineTo(420, -36); ctx.lineTo(420, 40); ctx.lineTo(220, 44); ctx.lineTo(180, 150); ctx.lineTo(110, 150);
    ctx.lineTo(120, 44); ctx.lineTo(10, 40); ctx.lineTo(-30, 120); ctx.lineTo(-110, 120); ctx.lineTo(-90, 24); ctx.lineTo(-420, 18); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = C.red; ctx.fillRect(40, -20, 140, 8); ctx.fillRect(-300, -6, 60, 6);
    ctx.restore();
  }
  function crosshair(x, y, gap, col = C.teal) {
    ctx.save(); ctx.fillStyle = col; ctx.shadowColor = 'rgba(0,0,0,.8)'; ctx.shadowBlur = 4;
    const len = 18, th = 4;
    ctx.fillRect(x - th / 2, y - gap - len, th, len); ctx.fillRect(x - th / 2, y + gap, th, len);
    ctx.fillRect(x - gap - len, y - th / 2, len, th); ctx.fillRect(x + gap, y - th / 2, len, th);
    ctx.fillRect(x - 2, y - 2, 4, 4);
    ctx.restore();
  }

  // ============ scene 1: cold open (0 - 2) ============
  function sOpen(t) {
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, C.navy); g.addColorStop(1, C.deep);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    grid(t, .05);
    // radar sweep
    ctx.save(); ctx.translate(W / 2, H / 2);
    ctx.strokeStyle = 'rgba(255,70,85,.18)'; ctx.lineWidth = 2;
    for (let r = 1; r <= 4; r++) { ctx.beginPath(); ctx.arc(0, 0, r * 130 * eOut(prog(t, 0, .6 + r * .1)), 0, TAU); ctx.stroke(); }
    const sw = t * 3.2; const sg = ctx.createConicGradient(sw, 0, 0);
    sg.addColorStop(0, 'rgba(255,70,85,.35)'); sg.addColorStop(.12, 'rgba(255,70,85,0)'); sg.addColorStop(1, 'rgba(255,70,85,0)');
    ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(0, 0, 520 * eOut(prog(t, 0, .8)), 0, TAU); ctx.fill();
    ctx.restore();
    // title words land on beats
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const words = [['ONE', .5], ['ROUND', 1.0], ['LEFT', 1.5]];
    ctx.font = A(230);
    const ws = words.map(w => ctx.measureText(w[0]).width), gap = 50;
    const total = ws.reduce((a, b) => a + b, 0) + gap * 2;
    let x = W / 2 - total / 2;
    words.forEach(([w, at], i) => {
      const k = eOutExpo(prog(t, at, at + .25));
      if (t >= at - .2) {
        ctx.save(); ctx.translate(x + ws[i] / 2, H / 2 - 10);
        ctx.scale(lerp(1.6, 1, k), lerp(1.6, 1, k)); ctx.globalAlpha = clamp(k * 2);
        ctx.fillStyle = i === 2 ? C.red : C.paper;
        ctx.fillText(scramble(w, t, at, .03, 40), 0, 0);
        ctx.restore();
      }
      x += ws[i] + gap;
    });
    ctx.font = F(26); ctx.fillStyle = C.mute; ctx.globalAlpha = prog(t, .2, .5);
    spaced(scramble('MATCH POINT  //  ROUND 24  //  1 v 5', t, .2, .02), W / 2, H / 2 + 170, 6);
    ctx.globalAlpha = 1;
    cornerHUD('REC ● LIVE');
    // red slash out
    const k = eIO(prog(t, 1.65, 2.0));
    if (k > 0) { ctx.fillStyle = C.red; para(lerp(-W * 1.4, -W * .2, k), 0, W * 1.4, H, 260); ctx.fill(); }
  }

  // ============ scene 2: agent select (2 - 4) ============
  const ROLES = ['DUELIST', 'CONTROLLER', 'INITIATOR', 'SENTINEL', 'FLEX'];
  function sSelect(t) {
    ctx.fillStyle = C.deep; ctx.fillRect(0, 0, W, H);
    grid(t + 2, .04, 80);
    // big background word
    ctx.save(); ctx.globalAlpha = .06; ctx.fillStyle = C.paper; ctx.font = A(520); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('SELECT', W / 2 - t * 120, H / 2); ctx.restore();
    const cw = 250, ch = 520, gap = 40, total = 5 * cw + 4 * gap, x0 = W / 2 - total / 2;
    const sel = 2, lock = prog(t, 1.0, 1.15), exit = prog(t, 1.75, 2.0);
    for (let i = 0; i < 5; i++) {
      const at = i * .12, k = eBack(prog(t, at, at + .4));
      const isSel = i === sel;
      const dim = isSel ? 1 : lerp(1, .35, prog(t, .75, 1.0));
      const sc = isSel ? lerp(1, 1.12, eOutExpo(lock)) : 1;
      const ex = eInExpo(prog(exit, i * .08, .6 + i * .08));
      ctx.save();
      ctx.translate(x0 + i * (cw + gap) + cw / 2, H / 2 + (1 - k) * 700 + ex * (i % 2 ? -1 : 1) * 1200);
      ctx.scale(sc, sc); ctx.globalAlpha = dim * clamp(k * 3);
      const g = ctx.createLinearGradient(0, -ch / 2, 0, ch / 2);
      g.addColorStop(0, isSel && lock > 0 ? '#3a1a22' : '#1a2632'); g.addColorStop(1, '#0d141b');
      ctx.fillStyle = g; para(-cw / 2, -ch / 2, cw, ch, 26); ctx.fill();
      ctx.strokeStyle = isSel && t > .75 ? C.red : 'rgba(236,232,225,.25)'; ctx.lineWidth = isSel && t > .75 ? 4 : 2; ctx.stroke();
      // role glyph
      ctx.save(); ctx.translate(0, -70);
      ctx.strokeStyle = isSel ? C.red : C.paper; ctx.lineWidth = 6; ctx.shadowColor = C.red; ctx.shadowBlur = isSel ? 30 * (lock + .3) : 0;
      ctx.rotate(Math.sin(t * 2 + i) * .08); roleGlyph(i, 62); ctx.stroke();
      ctx.restore();
      ctx.fillStyle = C.paper; ctx.font = F(26); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      spaced(ROLES[i], 0, 110, 3);
      ctx.fillStyle = C.mute; ctx.font = F(18, 600); spaced(`0${i + 1}`, 0, 160, 4);
      ctx.fillStyle = isSel ? C.red : 'rgba(236,232,225,.3)'; ctx.fillRect(-cw / 2 + 30, ch / 2 - 40, (cw - 60) * eOut(prog(t, at + .2, at + .6)), 5);
      ctx.restore();
    }
    // LOCKED IN stamp
    if (lock > 0) {
      const k = eOutExpo(lock), o = 1 - prog(t, 1.7, 1.85);
      ctx.save(); ctx.translate(W / 2, H / 2 + 330); ctx.scale(lerp(2.2, 1, k), lerp(2.2, 1, k)); ctx.globalAlpha = k * o;
      ctx.fillStyle = C.red; para(-260, -48, 520, 96, 20); ctx.fill();
      ctx.fillStyle = C.paper; ctx.font = A(70); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; spaced('LOCKED IN', 0, 4, 8);
      ctx.restore();
    }
    ctx.fillStyle = C.paper; ctx.font = F(24); ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.globalAlpha = prog(t, .1, .3) * (1 - exit);
    spaced(scramble('CHOOSE YOUR AGENT', t, .1, .02), 104, 110, 6, 'left');
    ctx.fillStyle = C.red; ctx.fillText(`0:${String(Math.max(0, 30 - Math.floor(t * 8))).padStart(2, '0')}`, W - 200, 110);
    ctx.globalAlpha = 1;
    cornerHUD();
  }

  // ============ scene 3: spike plant + build (4 - 8) ============
  function sSpike(t) {
    const T = t + 4;
    ctx.fillStyle = C.deep; ctx.fillRect(0, 0, W, H);
    const build = prog(t, 3, 4); // 7..8 riser
    // beat rings
    for (let b = 0; b < 8; b++) {
      const bt = t - b * BEAT; if (bt < 0 || bt > 1.4) continue;
      const k = eOut(bt / 1.4);
      ctx.strokeStyle = `rgba(255,70,85,${.5 * (1 - k)})`; ctx.lineWidth = 3 + 20 * (1 - k);
      ctx.beginPath(); ctx.arc(W / 2, H / 2, 160 + k * 900, 0, TAU); ctx.stroke();
    }
    // build-up: accelerating rings
    if (build > 0) {
      const n = 16;
      for (let i = 0; i < n; i++) {
        const ph = ((t - 3) * (2 + build * 10) + i / n) % 1;
        ctx.strokeStyle = `rgba(255,70,85,${.4 * (1 - ph) * build})`; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(W / 2, H / 2, 900 * (1 - ph), 0, TAU); ctx.stroke();
      }
    }
    // perspective floor
    ctx.save(); ctx.strokeStyle = 'rgba(255,70,85,.12)'; ctx.lineWidth = 2; ctx.beginPath();
    for (let i = -12; i <= 12; i++) { ctx.moveTo(W / 2 + i * 30, H * .62); ctx.lineTo(W / 2 + i * 260, H); }
    for (let j = 0; j < 10; j++) { const y = H * .62 + Math.pow(((j + t * 2) % 10) / 10, 2) * H * .38; ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke(); ctx.restore();

    const zoom = 1 + eInExpo(build) * 1.6;
    ctx.save(); ctx.translate(W / 2, H / 2 - 30); ctx.scale(zoom, zoom);
    // plant progress ring
    const plant = prog(t, 0, 1);
    ctx.strokeStyle = 'rgba(236,232,225,.15)'; ctx.lineWidth = 10;
    ctx.beginPath(); ctx.arc(0, 0, 190, 0, TAU); ctx.stroke();
    ctx.strokeStyle = C.red; ctx.lineCap = 'butt'; ctx.shadowColor = C.red; ctx.shadowBlur = 20;
    ctx.beginPath(); ctx.arc(0, 0, 190, -Math.PI / 2, -Math.PI / 2 + TAU * eIO(plant)); ctx.stroke();
    ctx.shadowBlur = 0;
    // ticks
    for (let i = 0; i < 60; i++) {
      const a = i / 60 * TAU; ctx.fillStyle = i / 60 < plant ? C.red : 'rgba(236,232,225,.2)';
      ctx.save(); ctx.rotate(a); ctx.fillRect(-1.5, -232, 3, i % 5 ? 10 : 20); ctx.restore();
    }
    // beep blink rate accelerates
    const rate = t < 1 ? 0 : 2 + Math.pow(prog(t, 1, 4), 2) * 14;
    const blink = t < 1 ? 1 : (Math.sin((t - 1) * rate * TAU * .5 + (t - 1) * (t - 1) * rate) > 0 ? 1 : .35);
    spikeIcon(0, 0, 120 * eBack(prog(t, 0, .4)), T, 40 * blink + 60 * build);
    ctx.restore();

    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (t < 1) {
      ctx.font = F(30); ctx.fillStyle = C.paper; ctx.globalAlpha = prog(t, 0, .1);
      spaced(scramble('PLANTING...', t, 0, .03), W / 2, H / 2 + 300, 10); ctx.globalAlpha = 1;
    }
    // SPIKE PLANTED banner + timer
    const bk = eOutExpo(prog(t, 1, 1.3)), bo = eInExpo(prog(t, 3.6, 3.95));
    if (bk > 0) {
      ctx.save(); ctx.globalAlpha = 1 - bo;
      ctx.fillStyle = C.red; para(W / 2 - 420 * bk, H / 2 + 250, 840 * bk, 100, 22); ctx.fill();
      ctx.fillStyle = C.paper; ctx.font = A(74);
      ctx.save(); ctx.beginPath(); ctx.rect(W / 2 - 420 * bk, H / 2 + 250, 840 * bk, 100); ctx.clip();
      spaced('SPIKE PLANTED', W / 2, H / 2 + 303, 10); ctx.restore();
      const secs = 45 - Math.floor(Math.max(0, t - 1) / BEAT);
      ctx.font = A(104); ctx.fillStyle = C.paper;
      const tp = 1 + .12 * beatPulse(t);
      ctx.save(); ctx.translate(W / 2, 196); ctx.scale(tp, tp); glowText(`0:${secs}`, 0, 0, secs <= 40 ? C.red : C.paper, 30); ctx.restore();
      ctx.restore();
    }
    // top score bar
    scoreBar(T, 1 - bo);
    cornerHUD('A SITE');
    // white-out into the drop
    ctx.fillStyle = '#fff'; ctx.globalAlpha = eInExpo(prog(t, 3.75, 4)); ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
  }
  function scoreBar(T, alpha, mid) {
    ctx.save(); ctx.globalAlpha = alpha; ctx.translate(W / 2, 54);

    d.fillStyle = d.createPattern(grain, 'repeat'); d.fillRect(0, 0, W + 256, H + 256); d.restore();
    d.globalCompositeOperation = 'source-over'; d.globalAlpha = .5;
    d.fillStyle = d.createPattern(scan, 'repeat'); d.fillRect(0, 0, W, H); d.globalAlpha = 1;
    const v = d.createRadialGradient(W / 2, H / 2, H * .4, W / 2, H / 2, H * 1.1);
    v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.55)'); d.fillStyle = v; d.fillRect(0, 0, W, H);
    const lb = 70 * eIO(prog(t, 7.2, 7.9)) * (1 - eIO(prog(t, 7.95, 8.05)));
    if (lb > .5) { d.fillStyle = '#000'; d.fillRect(0, 0, W, lb); d.fillRect(0, H - lb, W, lb); }
  }

  // motion blur: average `samples` sub-frames across a 180° shutter
  function renderBlurred(t, fps = 60, samples = 4) {
    if (samples <= 1) { frame(t, cv); return; }
    for (let i = 0; i < samples; i++) {
      frame(t + (i / samples) * (.5 / fps), acc);
      out.setTransform(1, 0, 0, 1, 0, 0); out.globalCompositeOperation = 'source-over';
      out.globalAlpha = 1 / (i + 1); out.drawImage(acc, 0, 0);
    }
    out.globalAlpha = 1;
  }
  window.renderFrame = renderBlurred;
  window.EDIT_DURATION = DURATION;
  window.fontsReady = document.fonts.load('400 40px "Anton"').then(() => document.fonts.load('700 40px "Chakra"')).then(() => document.fonts.load('600 40px "Chakra"'));

  // ============ playback ============
  if (params.has('capture')) { document.body.classList.add('capture'); return; }
  const aud = document.getElementById('aud'), playBtn = document.getElementById('play');
  const scrub = document.getElementById('scrub'), tc = document.getElementById('tc'), start = document.getElementById('start');
  let playing = false, hasAudio = true, t0 = 0, cur = 0;
  aud.addEventListener('error', () => { hasAudio = false; });
  const now = () => hasAudio && !aud.paused ? aud.currentTime : (performance.now() - t0) / 1000;
  function play() { playing = true; playBtn.textContent = 'PAUSE'; if (cur >= DURATION - .05) cur = 0;
    t0 = performance.now() - cur * 1000; if (hasAudio) { aud.currentTime = cur; aud.play().catch(() => { hasAudio = false; }); } }
  function pause() { playing = false; playBtn.textContent = 'PLAY'; aud.pause(); }
  start.onclick = () => { start.remove(); play(); };
  playBtn.onclick = () => playing ? pause() : play();
  scrub.oninput = () => { cur = scrub.value / 1000; if (playing) play(); else window.fontsReady.then(() => renderBlurred(cur, 60, 1)); };
  addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); start.isConnected ? start.click() : playBtn.click(); } });
  window.fontsReady.then(() => renderBlurred(0, 60, 1));
  (function tick() {
    if (playing) {
      cur = now();
      if (cur >= DURATION) { cur = 0; play(); }
      renderBlurred(cur, 60, 1);
      scrub.value = Math.round(cur * 1000); tc.textContent = cur.toFixed(2);
    }
    requestAnimationFrame(tick);
  })();
})();
</script>
</body>
